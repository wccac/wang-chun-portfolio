const dialog=document.querySelector('#detail-dialog');const viewer=dialog.querySelector('.viewer');const image=dialog.querySelector('.viewer-image');const canvas=dialog.querySelector('.viewer-canvas');const toggle=dialog.querySelector('.viewer-toggle');let origin=null;let animating=false;let fullArtwork=false;
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function geometry(){if(!origin)return null;const a=origin.querySelector('.crop').getBoundingClientRect();const b=viewer.getBoundingClientRect();return{x:a.left+a.width/2-b.left-b.width/2,y:a.top+a.height/2-b.top-b.height/2,s:Math.min(a.width/b.width,a.height/b.height)}}
function updateCrop(){if(!origin||fullArtwork||!image.naturalWidth)return;const w=canvas.clientWidth;const h=canvas.clientHeight;const dw=w*Number(origin.dataset.zoom);const dh=dw*image.naturalHeight/image.naturalWidth;canvas.style.setProperty('--image-width',dw+'px');canvas.style.setProperty('--image-left',(w/2-dw*Number(origin.dataset.focusX))+'px');canvas.style.setProperty('--image-top',(h/2-dh*Number(origin.dataset.focusY))+'px')}

new ResizeObserver(updateCrop).observe(canvas);
document.querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',async()=>{origin=button;fullArtwork=false;image.src=button.dataset.src;document.querySelector('#detail-title').textContent=button.dataset.detail;await image.decode();dialog.showModal();setView();const g=geometry();if(g&&!reduced())viewer.animate([{transform:'translate('+g.x+'px,'+g.y+'px) scale('+g.s+')',opacity:.1},{transform:'none',opacity:1}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});}));
toggle.addEventListener('click',()=>{fullArtwork=!fullArtwork;setView()});
async function closeDetail(){if(animating)return;animating=true;const g=geometry();if(g&&!reduced())await viewer.animate([{transform:'none',opacity:1},{transform:'translate('+g.x+'px,'+g.y+'px) scale('+g.s+')',opacity:0}],{duration:230,easing:'cubic-bezier(.4,0,.7,.2)'}).finished;dialog.close();origin?.focus({preventScroll:true});animating=false}
dialog.querySelector('.viewer-close').addEventListener('click',closeDetail);dialog.addEventListener('cancel',e=>{e.preventDefault();closeDetail()});dialog.addEventListener('click',e=>{if(e.target===dialog)closeDetail()});
