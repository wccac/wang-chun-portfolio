<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#192d25">
  <meta name="description" content="走进王淳的创作小屋，探索檀晷、苦瓜书与牡丹熊猫花园。">
  <title>王淳 · 创作小屋</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="../S01-pixel-cottage-exterior-v1.png">
  <link rel="stylesheet" href="app.css?v=20261005-fluid-navigation">
  <link rel="stylesheet" href="music.css?v=20261005-fluid-navigation">
  <link rel="stylesheet" href="story-motion.css?v=20261005-fluid-navigation">
  <link rel="stylesheet" href="book-motion.css?v=20261005-fluid-navigation">
  <link rel="stylesheet" href="panda-motion.css?v=20261005-fluid-navigation">
  <script defer src="world-bridge.js?v=20261005-fluid-navigation"></script>
  <script defer src="music.js?v=20261005-fluid-navigation"></script>
  <script defer src="story-motion.js?v=20261005-fluid-navigation"></script>
  <script defer src="book-motion.js?v=20261005-book-continuous-v4"></script>
  <script defer src="panda-motion.js?v=20261005-fluid-navigation"></script>
  <script defer src="app.js?v=20261005-book-entry-v5"></script>
</head>
<body>
  <main id="experience" data-mode="scene" aria-label="王淳的创作小屋">
    <div id="scene-viewport">
      <div id="stage" aria-label="小屋场景">
        <div id="scenes"></div>
        <div id="hotspots"></div>
        <div id="knock" aria-hidden="true"><i></i><i></i></div>
      </div>
      <div class="scene-shade" aria-hidden="true"></div>
    </div>
    <header class="cottage-header">
      <div class="scene-navigation" role="group" aria-label="场景导航">
        <button id="back-button" class="icon-button" type="button" aria-label="返回上一场景" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-7 7 7 7M4 12h16"/></svg></button>
        <a class="identity icon-button" href="#cottage" aria-label="回到小屋外景">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-6 8 6M6.5 9v10h11V9M10 19v-6h4v6"/></svg>
        </a>
        <span class="cottage-identity">王淳<span>创作小屋</span></span>
      </div>
      <nav aria-label="小屋导航">
        <button id="replay-button" class="icon-button" type="button" aria-label="重看作品进入动画" title="重看进入动画" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a7 7 0 1 1-1 5M5 4v5h5"/></svg></button>
        <button id="sound-toggle" class="quiet-button icon-button" type="button" aria-pressed="false" aria-label="开启声音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 5 6 9H3.5v6H6l4.5 4Z"/><path class="sound-wave" d="M14 8c2.5 2 2.5 6 0 8m3-11c4.5 3.5 4.5 10.5 0 14"/><path class="sound-muted" d="m15.5 9 5 6m0-6-5 6"/></svg>
          <span class="sound-label sr-only">声音关</span>
        </button>
        <button id="directory-toggle" class="quiet-button icon-button" type="button" aria-label="打开作品目录" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="5" height="5" rx=".5"/><rect x="14" y="5" width="5" height="5" rx=".5"/><rect x="5" y="14" width="5" height="5" rx=".5"/><rect x="14" y="14" width="5" height="5" rx=".5"/></svg>
        </button>
      </nav>
    </header>
    <div class="scene-footer">
      <div class="location"><span id="location" class="sr-only">庭院</span></div>
      <div class="scene-caption sr-only"><p id="scene-title">推开门，看看我做的东西。</p><p id="scene-hint">点击小屋，开始探索</p></div>
      <div id="mobile-actions" hidden aria-hidden="true"></div>
    </div>
    <section id="world-view" aria-label="作品世界" hidden>
      <iframe id="world-frame" title="作品展示" tabindex="0"></iframe>
    </section>
    <div id="interaction-curtain" aria-hidden="true"></div>
    <div id="transition-status" hidden><span id="transition-copy" class="sr-only">走近小屋</span><span id="transition-loading" class="transition-loading" aria-hidden="true" hidden></span><button id="cancel-transition" class="transition-control" type="button" hidden>取消</button><button id="skip-button" class="transition-control" type="button" aria-label="跳过入场动画" hidden>跳过</button></div>
    <div id="loading" role="status"><span class="loading-mark" aria-hidden="true"></span><p class="sr-only">正在加载小屋</p></div>
    <div id="error-notice" role="alert" hidden><p>画面暂时没有加载好。</p><button id="retry-button" type="button">重新载入</button><button id="error-back" type="button">回到小屋</button></div>
  </main>
  <dialog id="directory" aria-labelledby="directory-title">
    <div class="directory-head"><div><p class="directory-owner">王淳 · 创作作品集</p><h1 id="directory-title">作品</h1></div><button id="directory-close" class="icon-button" type="button" aria-label="关闭作品目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></div>
    <div class="project-grid">
      <button class="project-link" type="button" data-project="tangui"><img src="../world-design/W01-tangui-world.png" alt="" decoding="sync"><span><strong>檀晷</strong><small>产品设计</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13"/></svg></button>
      <button class="project-link" type="button" data-project="bitter"><img src="../world-design/W02-bitter-melon-world.png" alt="" decoding="sync"><span><strong>BITTER MELON</strong><small>书籍设计</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13"/></svg></button>
      <button class="project-link" type="button" data-project="panda"><img src="../world-design/W03-panda-world.png" alt="" decoding="sync"><span><strong>牡丹熊猫花园</strong><small>刺绣作品</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13"/></svg></button>
    </div>
    <button class="directory-room" id="directory-room" type="button">回到小屋 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 5 7 7-7 7M4 12h16"/></svg></button>
    <label class="directory-motion"><input id="motion-toggle" type="checkbox"><span>简化进入镜头</span><small>用轻柔淡入进入作品</small></label>
    <p class="sr-only">键盘 Tab 选择物件，Enter 进入，Esc 返回。</p>
  </dialog>
  <p id="live-status" class="sr-only" aria-live="polite"></p>
  <noscript><div class="no-script">请启用 JavaScript 来探索小屋，或<a href="../world-design/index.html">直接查看作品</a>。</div></noscript>
</body>
</html>
